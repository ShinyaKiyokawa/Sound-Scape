<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上野駅のサウンドスケープ</title>
<meta property="og:title" content="上野駅のサウンドスケープ">
<meta property="og:description" content="上野界隈で収録した環境音。地図上のアイコンをタップして聴いてみてください。">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0e;--surface:#181818;--border:rgba(255,255,255,0.08);
  --text:#f0f0f0;--muted:#888;
  --accent:#5DCAA5;--accent-dark:#1D9E75;--play:#D85A30;
  --font:'Helvetica Neue','Hiragino Sans','Noto Sans JP',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
header{padding:18px 24px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:baseline;gap:16px}
header h1{font-size:18px;font-weight:500;letter-spacing:.02em}
header .sub{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
#map{width:100%;height:calc(100vh - 58px - 64px);min-height:400px}
.leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.7)}
.leaflet-control-attribution{display:none}
.leaflet-bar a{background:var(--surface)!important;color:var(--text)!important;border:0.5px solid var(--border)!important}
.sound-marker{
  width:44px;height:44px;border-radius:50%;background:var(--accent-dark);
  border:2.5px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s,background .15s;box-shadow:0 3px 12px rgba(0,0,0,.5);
}
.sound-marker:hover{transform:scale(1.12);background:var(--accent)}
.sound-marker.playing{background:var(--play);animation:ripple 1.4s infinite}
.sound-marker svg{width:20px;height:20px;fill:white}
@keyframes ripple{
  0%{box-shadow:0 0 0 0 rgba(216,90,48,.55)}
  70%{box-shadow:0 0 0 12px rgba(216,90,48,0)}
  100%{box-shadow:0 0 0 0 rgba(216,90,48,0)}
}
.leaflet-popup-content-wrapper{
  background:#1e1e1e!important;color:var(--text)!important;border-radius:14px!important;
  border:0.5px solid rgba(255,255,255,.12)!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;padding:0!important;
}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-content{margin:0!important;width:auto!important}
.popup-inner{padding:14px 16px 12px;min-width:200px}
.popup-name{font-size:13px;font-weight:500;margin-bottom:3px}
.popup-desc{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.popup-actions{display:flex;flex-direction:column;gap:7px}
.popup-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 0;border-radius:8px;border:none;font-size:12px;font-weight:500;
  font-family:var(--font);cursor:pointer;transition:background .15s;
}
.popup-btn.play-btn{background:rgba(93,202,165,.15);color:var(--accent)}
.popup-btn.play-btn:hover{background:rgba(93,202,165,.26)}
.popup-btn.play-btn.playing{background:rgba(216,90,48,.15);color:#ef9f7a}
.popup-btn.nav-btn{background:rgba(66,133,244,.13);color:#7ab3f5;text-decoration:none}
.popup-btn.nav-btn:hover{background:rgba(66,133,244,.24)}
.popup-btn svg{width:14px;height:14px;flex-shrink:0}
#now-playing{
  height:64px;border-top:0.5px solid var(--border);display:flex;align-items:center;
  padding:0 20px;gap:14px;background:var(--surface);
}
.np-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:blink 1.1s infinite}
#now-playing.idle .np-dot{background:var(--muted);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.np-info{flex:1;overflow:hidden}
.np-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-desc{font-size:11px;color:var(--muted)}
#stop-btn{
  padding:7px 14px;border-radius:20px;border:0.5px solid var(--border);
  background:transparent;color:var(--muted);font-size:12px;font-family:var(--font);
  cursor:pointer;flex-shrink:0;display:none;
}
#stop-btn.visible{display:block}
#loading{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;font-size:14px;color:var(--muted);z-index:9999;
}
</style>
</head>
<body>
<div id="loading">データを読み込み中...</div>
<header>
  <h1>上野駅のサウンドスケープ</h1>
  <span class="sub" id="rec-count">loading...</span>
</header>
<div id="map"></div>
<div id="now-playing" class="idle">
  <div class="np-dot"></div>
  <div class="np-info">
    <div class="np-name" id="np-name">Hover or tap to play</div>
    <div class="np-desc" id="np-desc">Soundscape · Ueno, Tokyo</div>
  </div>
  <button id="stop-btn">■ Stop</button>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// =============================
// ここだけ書き換えてください
const FOLDER_ID = "1Lf7oH1PlaZwOpiLdknjGMUiX7m9qjrSH";
const CLIENT_ID = "1098214416585-ud07t2m49tifqou1sl1rlkia6jjdof3a.apps.googleusercontent.com";
// =============================

const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";
const SCOPES = "https://www.googleapis.com/auth/drive.readonly";

let sounds = [];
let currentAudio = null, currentId = null;
const leafletMarkers = {};

const spkSVG = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
const pauSVG = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

const map = L.map("map").setView([35.7135, 139.7745], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

function stopAll() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentId !== null) {
    const el = document.getElementById("m" + currentId);
    if (el) { el.classList.remove("playing"); el.innerHTML = spkSVG; }
    const btn = document.getElementById("b" + currentId);
    if (btn) { btn.classList.remove("playing"); btn.innerHTML = '▶ Play'; }
    currentId = null;
  }
  document.getElementById("now-playing").classList.add("idle");
  document.getElementById("np-name").textContent = "Hover or tap to play";
  document.getElementById("np-desc").textContent = "Soundscape · Ueno, Tokyo";
  document.getElementById("stop-btn").classList.remove("visible");
}

function play(s) {
  if (currentId === s.id) { stopAll(); return; }
  stopAll();
  const audio = new Audio(s.audioUrl);
  audio.onended = stopAll;
  audio.play().catch(() => {});
  currentAudio = audio; currentId = s.id;
  const el = document.getElementById("m" + s.id);
  if (el) { el.classList.add("playing"); el.innerHTML = pauSVG; }
  const btn = document.getElementById("b" + s.id);
  if (btn) { btn.classList.add("playing"); btn.innerHTML = '■ Stop'; }
  document.getElementById("now-playing").classList.remove("idle");
  document.getElementById("np-name").textContent = s.name;
  document.getElementById("np-desc").textContent = s.desc;
  document.getElementById("stop-btn").classList.add("visible");
}

document.getElementById("stop-btn").addEventListener("click", stopAll);

function buildMarkers() {
  sounds.forEach(s => {
    const el = document.createElement("div");
    el.className = "sound-marker"; el.id = "m" + s.id; el.innerHTML = spkSVG;
    el.addEventListener("click", () => play(s));
    const marker = L.marker([s.lat, s.lng], {
      icon: L.divIcon({ className: "", html: el, iconSize: [44, 44], iconAnchor: [22, 22], popupAnchor: [0, -28] })
    }).addTo(map);
    const gmUrl = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
    marker.bindPopup(`
      <div class="popup-inner">
        <div class="popup-name">${s.name}</div>
        <div class="popup-desc">${s.desc}</div>
        <div class="popup-actions">
          <button class="popup-btn play-btn" id="b${s.id}" onclick="play(sounds[${s.id - 1}])">▶ Play</button>
          <a class="popup-btn nav-btn" href="${gmUrl}" target="_blank">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M21 3L3 10.53v.98l6.84 2.65L12.48 21h.98L21 3z"/></svg>
            Google Maps
          </a>
        </div>
      </div>`, { closeButton: false, autoClose: false, closeOnClick: false });
    el.addEventListener("mouseenter", () => marker.openPopup());
    el.addEventListener("mouseleave", () => {
      setTimeout(() => {
        const pe = marker.getPopup()?.getElement();
        if (pe && !pe.matches(":hover")) marker.closePopup();
      }, 180);
    });
    marker.on("popupopen", () => {
      const pe = marker.getPopup()?.getElement();
      if (pe) pe.addEventListener("mouseleave", () => marker.closePopup());
    });
    leafletMarkers[s.id] = marker;
  });
  document.getElementById("rec-count").textContent = `${sounds.length} recordings · Ueno, Tokyo`;
  document.getElementById("loading").style.display = "none";
}

async function loadFromDrive(token) {
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+name='coords.json'&fields=files(id)`,
    { headers: { Authorization: "Bearer " + token } }
  );
  const data = await res.json();
  if (!data.files || data.files.length === 0) {
    document.getElementById("loading").textContent = "データが見つかりません。管理画面から保存してください。";
    return;
  }
  const fileId = data.files[0].id;
  const fileRes = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers: { Authorization: "Bearer " + token } }
  );
  sounds = await fileRes.json();
  buildMarkers();
}

async function initGapi() {
  await new Promise(r => { const s = document.createElement("script"); s.src = "https://apis.google.com/js/api.js"; s.onload = r; document.head.appendChild(s); });
  await new Promise(r => gapi.load("client", r));
  await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
  await new Promise(r => { const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.onload = r; document.head.appendChild(s); });
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: async (resp) => { if (resp.access_token) await loadFromDrive(resp.access_token); }
  });
  tokenClient.requestAccessToken({ prompt: "" });
}

initGapi().catch(e => {
  document.getElementById("loading").textContent = "読み込みエラー: " + e.message;
});
</script>
</body>
</html>
